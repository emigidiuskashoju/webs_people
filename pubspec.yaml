name: webs_people
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP / networking
  http: ^1.6.0
  connectivity_plus: ^7.3.1

  # Local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.1.1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6

  # Contacts
  flutter_contacts: ^2.1.0

  # Location / maps
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_maps_flutter: ^2.18.1

  # Device / app information
  uuid: ^4.6.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

  # Battery
  battery_plus: ^7.1.1

  # Media / files
  image_picker: ^1.2.3

  # Calling
  flutter_webrtc: ^1.6.2+hotfix.3

  # External apps
  url_launcher: ^6.3.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Push notifications via Firebase Cloud Messaging
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_ringtone_player: ^4.0.0+4
  vibration: ^3.2.1
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_background_service_ios: ^5.0.3
  country_picker: ^2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/images/webs_bg_light.png
    - assets/images/webs_bg_dark.png
    - assets/logos/

